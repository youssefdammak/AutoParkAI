<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Parking Map</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --available: #27ae60;
      --occupied: #c0392b;
      --road: #bdc3c7;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      padding: 2rem;
    }

    .card {
      max-width: 1000px;
      margin: auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .card-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--text);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .parking-lot {
      display: grid;
      grid-template-columns: 50px repeat(10, 1fr) 50px;
      gap: 10px;
      align-items: center;
      margin-bottom: 2rem;
    }

    .row-label {
      writing-mode: vertical-rl;
      text-align: center;
      color: #7f8c8d;
      font-size: 0.8rem;
    }

    .spot {
      background: var(--road);
      height: 45px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .spot.available {
      background: var(--available);
    }

    .spot.occupied {
      background: var(--occupied);
    }

    .spot:hover {
      transform: scale(1.05);
    }

    .road-label {
      grid-column: span 12;
      background: var(--road);
      text-align: center;
      padding: 0.5rem;
      border-radius: 8px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #555;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .available-box {
      background: var(--available);
    }

    .occupied-box {
      background: var(--occupied);
    }

    .road-box {
      background: var(--road);
    }

    @media (max-width: 768px) {
      .parking-lot {
        grid-template-columns: 30px repeat(5, 1fr) 30px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-title">Smart Parking Lot Map</div>

    <div class="road-label">Entrance ➡️</div>

    <!-- First Row (A) -->
    <div class="parking-lot">
      <div class="row-label">A</div>
      <div class="spot available">A1</div>
      <div class="spot occupied">A2</div>
      <div class="spot available">A3</div>
      <div class="spot occupied">A4</div>
      <div class="spot available">A5</div>
      <div class="spot available">A6</div>
      <div class="spot occupied">A7</div>
      <div class="spot available">A8</div>
      <div class="spot available">A9</div>
      <div class="spot occupied">A10</div>
      <div class="row-label">A</div>
    </div>

    <!-- Second Row (B) -->
    <div class="parking-lot">
      <div class="row-label">B</div>
      <div class="spot occupied">B1</div>
      <div class="spot available">B2</div>
      <div class="spot occupied">B3</div>
      <div class="spot available">B4</div>
      <div class="spot available">B5</div>
      <div class="spot occupied">B6</div>
      <div class="spot available">B7</div>
      <div class="spot available">B8</div>
      <div class="spot occupied">B9</div>
      <div class="spot available">B10</div>
      <div class="row-label">B</div>
    </div>

    <div class="road-label">⬅️ Exit</div>

    <div class="legend">
      <div class="legend-item"><div class="legend-box available-box"></div> Available</div>
      <div class="legend-item"><div class="legend-box occupied-box"></div> Occupied</div>
      <div class="legend-item"><div class="legend-box road-box"></div> Road</div>
    </div>
  </div>
</body>
</html>
