<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParkAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-parking"></i>
                <div>
                    <h1>AutoParkAI</h1>
                    <p>Smart Parking Management</p>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="#"><i class="fas fa-home"></i>Home</a></li>
                    <li><a href="#"><i class="fas fa-map-marker-alt"></i> Parking Map</a></li>
                    <li><a href="#"><i class="fas fa-history"></i> History</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="#"><i class="fas fa-user"></i> Account</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-container">
        <section class="hero">
            <h2>Revolutionary Smart Parking Solution</h2>
            <p>Experience seamless parking with our AI-powered system that guides you to available spots in real-time and helps you find your car effortlessly.</p>
            <div class="cta-buttons">
                <button class="cta-button">
                    <i class="fas fa-car"></i> Check Availability
                </button>
                <button class="cta-button outline">
                    <i class="fas fa-directions"></i> Get Directions
                </button>
            </div>
        </section>
    </div>
</body>
</html>
